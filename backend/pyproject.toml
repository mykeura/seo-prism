[tool.poetry]
name = "seo-prism"
version = "1.22.0"
description = "SEO Analyzer Tool - Detect broken links and missing meta-tags"
authors = ["mykeura <mykeura@hotmail.com>"]
license = "AGPL-3.0-only OR LicenseRef-SEO-Prism-Commercial"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
aiohttp = "^3.9.0"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
beautifulsoup4 = "^4.12.0"
click = "^8.1.0"
mcp = ">=2.0"
python-pptx = ">=0.6.21"
reportlab = ">=4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[tool.poetry.scripts]
scan = "cli:main"
seo-prism-mcp = "mcp_server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"